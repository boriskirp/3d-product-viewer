<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal 3D Product Showcase Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; }
        
        /* Minimalist UI Signal Layer */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; width: 320px; z-index: 100;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h2 { margin-top: 0; font-weight: 600; font-size: 1.4em; letter-spacing: -0.5px; color: #00ff88; }
        p { color: #b3b3b3; font-size: 0.95em; line-height: 1.5; }

        .btn {
            display: block; width: 100%; padding: 12px; margin: 12px 0;
            background: #222222; color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); 
            border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600;
            transition: all 0.3s ease; box-sizing: border-box;
        }
        .btn:hover { background: #00ff88; color: #1a1a1a; box-shadow: 0 0 15px rgba(0,255,136,0.4); }

        /* Commercial License Protection Screen */
        #activation-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111111; z-index: 1000; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lock-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 40px; border-radius: 20px; text-align: center; width: 360px;
            backdrop-filter: blur(10px);
        }
        .input-field {
            width: 100%; padding: 12px; margin: 20px 0; background: #222;
            border: 1px solid #444; border-radius: 8px; color: white;
            text-align: center; font-size: 1.1em; letter-spacing: 2px; box-sizing: border-box;
        }
        .input-field:focus { border-color: #00ff88; outline: none; }
    </style>
</head>
<body>

    <div id="activation-lock">
        <div class="lock-box">
            <h2>Activate License</h2>
            <p>Please enter your Gumroad/Envato purchase key to unlock this 3D component preview.</p>
            <input type="text" id="license-key-input" class="input-field" placeholder="GUM-XXXXXX" autocomplete="off">
            <button class="btn" onclick="validateLicense()">Verify Product Key</button>
            <p id="error-msg" style="color: #ff3333; display: none; font-size: 0.85em;"></p>
        </div>
    </div>

    <div id="ui-layer">
        <h2 id="component-title">3D Viewer Active</h2>
        <p id="component-desc">Click on the interactive 3D nodes or use the control deck below to inspect product features.</p>
        
        <div id="control-deck" style="margin-top: 20px;">
            <button class="btn" onclick="focusComponent('body')">Inspect Main Housing</button>
            <button class="btn" onclick="focusComponent('core')">Inspect Processing Core</button>
            <button class="btn" onclick="focusComponent('node')">Inspect Wireless Module</button>
        </div>
    </div>

    <script>
        const COMPONENT_ID = "3D-SHOWCASE-v1";
        
        // Demo Validation Key (In production, this hooks into the Platform's Webhook/API)
        const demoLicenseKey = "GUM-PREVIEW-2026"; 

        // 3D Engine Variables
        let scene, camera, renderer, controls;
        let mainHousing, processingCore, wirelessModule;

        // --- LICENSE VALIDATION LOGIC ---
        function validateLicense() {
            const userInput = document.getElementById('license-key-input').value.trim().toUpperCase();
            const errorElement = document.getElementById('error-msg');

            if (userInput === demoLicenseKey) {
                localStorage.setItem('LicenseVerified_' + COMPONENT_ID, 'true');
                
                // Pure Unlocking Animation
                const lockGate = document.getElementById('activation-lock');
                lockGate.style.opacity = '0';
                lockGate.style.transform = "scale(1.1)";
                setTimeout(() => { lockGate.style.display = 'none'; init3DEngine(); }, 600);
            } else {
                errorElement.style.display = "block";
                errorElement.innerText = "Invalid Key. Use code: GUM-PREVIEW-2026";
            }
        }

        // --- 3D INTERACTIVE ENGINE ---
        function init3DEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.Camera(); // Basic configuration, setup perspectives below
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting Matrix (Clean Digital Studio Setup)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00ff88, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const blueLight = new THREE.DirectionalLight(0x007bff, 0.6);
            blueLight.position.set(-5, -5, -5);
            scene.add(blueLight);

            // --- CONCEPTUAL 3D OBJECT GEOMETRY (The Signal) ---
            // Main Housing
            const housingGeo = new THREE.BoxGeometry(4, 2, 4);
            const housingMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.8 });
            mainHousing = new THREE.Mesh(housingGeo, housingMat);
            scene.add(mainHousing);

            // Processing Core
            const coreGeo = new THREE.CylinderGeometry(1, 1, 3, 32);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x004411, roughness: 0.1 });
            processingCore = new THREE.Mesh(coreGeo, coreMat);
            processingCore.position.y = 1;
            scene.add(processingCore);

            // Wireless Module Nodes
            const nodeGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x007bff, roughness: 0.5 });
            wirelessModule = new THREE.Mesh(nodeGeo, nodeMat);
            wirelessModule.position.set(1.5, 1.5, 1.5);
            scene.add(wirelessModule);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // --- CONTEXTUAL INTERACTIVE DECK ---
        function focusComponent(type) {
            const title = document.getElementById('component-title');
            const desc = document.getElementById('component-desc');

            if (type === 'body') {
                title.innerText = "Main Structural Housing";
                desc.innerText = "High-durability anodized aluminum shell. Designed to protect core computing matrix from environmental factors and physical impacts.";
                camera.position.set(0, 3, 8);
            } else if (type === 'core') {
                title.innerText = "Processing Core Core unit";
                desc.innerText = "Central computational engine. Handles real-time signal processing, telemetry data compilation, and algorithmic routing executions.";
                camera.position.set(0, 2, 5);
            } else if (type === 'node') {
                title.innerText = "Wireless Connectivity Node";
                desc.innerText = "Multi-band secure transceiver array. Establishes localized zero-noise telemetry links and high-speed synchronized data streams.";
                camera.position.set(2, 2, 4);
            }
            controls.target.copy(scene.position);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle Autonomous Rotation (Dynamic Signal Feedback)
            if(mainHousing) mainHousing.rotation.y += 0.002;
            if(processingCore) processingCore.rotation.x += 0.005;
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Auto-check on load
        window.onload = () => {
            if (localStorage.getItem('LicenseVerified_' + COMPONENT_ID) === 'true') {
                document.getElementById('activation-lock').style.display = 'none';
                init3DEngine();
            }
        };
    </script>
</body>
</html>
